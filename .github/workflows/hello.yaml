name: hello
on: push
jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Committed!"

  test_code:
    runs-on: ubuntu-latest
    steps:
        - name: Testing 
          uses: actions/checkout@v4
          uses: actions/setup-python@v5
          with:
            python-version: '3.14'
          run: pip install uv && uv sync
          run: pytest tests/